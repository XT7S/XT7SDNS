name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Expo project
        run: npx --yes create-expo-app@latest app --template blank
      - name: Add game dns files
        run: |
          mkdir -p app/plugins app/native-android
          cp App.js apply.js app/
          cp withDnsVpn.js app/plugins/
          cp *.kt app/native-android/
      - name: Prebuild
        working-directory: app
        run: |
          node apply.js
          npx expo prebuild --platform android
      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: game-dns-apk
          path: app/android/app/build/outputs/apk/release/*.apk
